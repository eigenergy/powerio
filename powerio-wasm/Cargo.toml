[package]
name = "powerio-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Browser bindings for local PowerIO file conversion"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
powerio.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# sqlite-wasm-rs 0.6 requires the embedding host to select its host functions.
sqlite-wasm-rs = { version = "0.6.2", default-features = false, features = ["wasm-bindgen"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true

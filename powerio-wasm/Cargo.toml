[package]
name = "powerio-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Browser bindings for local PowerIO file conversion"
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/eigenergy/powerio/tree/main/powerio-wasm#readme"
keywords = ["matpower", "power-systems", "wasm", "converter"]
# Not on crates.io: the release publishes the wasm-pack build of this crate to
# npm as `powerio-wasm` (.github/workflows/npm.yml).
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
powerio.workspace = true
serde_json.workspace = true
wasm-bindgen = "=0.2.130"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# sqlite-wasm-rs 0.6 requires the embedding host to select its host functions.
sqlite-wasm-rs = { version = "0.6.2", default-features = false, features = ["wasm-bindgen"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dev-dependencies]
rusqlite.workspace = true

[lints]
workspace = true

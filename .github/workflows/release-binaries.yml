name: Release binaries

# Build the powerio-capi cdylib (with arrow, matrix, gridfm, dist, pkg, and prob
# features) for the five platforms PowerIO.jl's Artifacts.toml covers, package
# each as the artifact tarball that file references (lib/ or bin/ layout, Julia
# platform triplet in the name), and attach them to the GitHub release on a
# version tag. A workflow_dispatch run builds the same tarballs as workflow
# artifacts only.
#
# After tagging, run PowerIO.jl's gen/update_artifacts.jl <tag> to rewrite its
# Artifacts.toml with the real sha256/git-tree-sha1 of these tarballs.
#
# linux builds run on ubuntu-22.04 for the older glibc floor (2.35); aarch64
# linux is cross-compiled so the job doesn't need an ARM runner label.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The release gate. PIO_ABI_VERSION does not cover document formats -- the v4
  # policy is that data evolves through versioned payloads -- so a release can
  # break the Julia binding with both ABI integers unchanged and every other
  # check green. v0.8.0 did exactly that: .pio.json moved 0.1.1 -> 0.2.0, the
  # binding's artifact gate compared only the integers, and the break surfaced
  # downstream after the release was public.
  #
  # julia-binding.yml already proves a powerio pull request works against the
  # binding, but it tests whichever companion branch exists, and nothing made
  # the pair land together: the v0.8.0 pull request passed against a PowerIO.jl
  # branch that was never merged. This job closes that by testing the tag
  # against PowerIO.jl's DEFAULT branch, which is what users actually get.
  #
  # It gates `build`, so a failure produces no tarballs and no draft release.
  # To release a deliberate binding break, merge the paired PowerIO.jl change
  # first, then re-run this workflow -- that ordering is the point.
  binding-gate:
    name: PowerIO.jl main against this tag
    # Tag pushes only. A workflow_dispatch run builds artifact-only tarballs
    # and attaches nothing to a release, so it needs no gate — and it doubles
    # as the documented bypass for releasing a deliberate binding break (the
    # error messages below point at it). Without this condition the "dispatch
    # manually" advice would run the same gate and fail identically.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Probe PowerIO.jl access
      id: powerio-jl
      env:
        POWERIO_JL_TOKEN: ${{ secrets.POWERIO_JL_REPO_TOKEN }}
      run: |
        # Validate, never assume: a set-but-expired token would otherwise pass
        # here and die minutes later in checkout with a generic auth error and
        # no pointer at the stale secret. Actions masks the secret in logs.
        if [ -n "${POWERIO_JL_TOKEN}" ] \
          && git ls-remote "https://x-access-token:${POWERIO_JL_TOKEN}@github.com/eigenergy/PowerIO.jl.git" HEAD >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif git ls-remote https://github.com/eigenergy/PowerIO.jl.git HEAD >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          # Deliberately NOT a silent pass. On a pull request an unreachable
          # binding is a skipped nicety; on a release it means the gate did not
          # run, and shipping as if it had is how this class of break escapes.
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Require the binding to be reachable
      if: steps.powerio-jl.outputs.available != 'true'
      run: |
        echo "::error::Cannot reach eigenergy/PowerIO.jl (no valid POWERIO_JL_REPO_TOKEN, \
        and the repo is not public), so the release gate could not run. Fix the token to \
        release; a workflow_dispatch run still builds artifact-only tarballs without the gate."
        exit 1
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi
      run: |
        cargo build -p powerio-capi --release \
          --features arrow,matrix,gridfm,dist,pkg,prob
    - name: Check out PowerIO.jl default branch
      uses: actions/checkout@v6
      with:
        repository: eigenergy/PowerIO.jl
        path: PowerIO.jl
        token: ${{ secrets.POWERIO_JL_REPO_TOKEN || github.token }}
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    - uses: julia-actions/cache@v3
    - name: Test PowerIO.jl against this tag
      env:
        POWERIO_CAPI: ${{ github.workspace }}/target/release/libpowerio_capi.so
      run: |
        julia --project=PowerIO.jl -e 'using Pkg; Pkg.instantiate(); Pkg.test()' || {
          echo "::error::PowerIO.jl's default branch fails against this tag. Merge the \
          paired PowerIO.jl change before releasing, then re-run this workflow on the tag. \
          Releasing anyway leaves the binding's tracking pipeline failing nightly until \
          the pair lands; a workflow_dispatch run builds ungated artifact-only tarballs \
          if you need binaries meanwhile."
          exit 1
        }

  build:
    needs: binding-gate
    # Run when the gate passed OR was skipped (workflow_dispatch, which builds
    # artifact-only tarballs and attaches nothing) — but never when it failed.
    # A plain `needs:` would skip this job whenever the gate is skipped, which
    # would break dispatch builds entirely.
    if: always() && (needs.binding-gate.result == 'success' || needs.binding-gate.result == 'skipped')
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            triplet: x86_64-linux-gnu
            lib: libpowerio_capi.so
          - runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-gnu
            triplet: aarch64-linux-gnu
            lib: libpowerio_capi.so
            cross_gcc: gcc-aarch64-linux-gnu
          # Cross-compiled: the macos-13 x86_64 runners are retired, and an
          # arm64 runner with the x86_64 toolchain target links fine.
          - runner: macos-14
            rust_target: x86_64-apple-darwin
            triplet: x86_64-apple-darwin
            lib: libpowerio_capi.dylib
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            triplet: aarch64-apple-darwin
            lib: libpowerio_capi.dylib
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            triplet: x86_64-w64-mingw32
            lib: powerio_capi.dll
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}
      - name: Install cross linker
        if: matrix.cross_gcc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_gcc }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build powerio-capi
        run: cargo build -p powerio-capi --release --features arrow,matrix,gridfm,dist,pkg,prob --target ${{ matrix.rust_target }}
      # Artifact layout PowerIO.jl's _artifact_lib() resolves: the cdylib under
      # lib/ (bin/ on Windows, renamed to the lib-prefixed name BinaryBuilder
      # would produce), the C header under include/, licenses at the root.
      - name: Package tarball
        shell: bash
        run: |
          stage=stage/libpowerio_capi
          built="target/${{ matrix.rust_target }}/release/${{ matrix.lib }}"
          case "${{ matrix.triplet }}" in
            *-mingw32)
              mkdir -p "$stage/bin"
              cp "$built" "$stage/bin/libpowerio_capi.dll"
              ;;
            *)
              mkdir -p "$stage/lib"
              cp "$built" "$stage/lib/${{ matrix.lib }}"
              ;;
          esac
          mkdir -p "$stage/include"
          cp powerio-capi/include/powerio.h "$stage/include/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "libpowerio_capi.${{ matrix.triplet }}.tar.gz" -C "$stage" .
          # informational; gen/update_artifacts.jl recomputes from the release assets
          shasum -a 256 "libpowerio_capi.${{ matrix.triplet }}.tar.gz" \
            || sha256sum "libpowerio_capi.${{ matrix.triplet }}.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: libpowerio_capi.${{ matrix.triplet }}
          path: libpowerio_capi.${{ matrix.triplet }}.tar.gz
      # The draft release body is the CHANGELOG section for this version (the
      # v0.0.1 release shipped with a bare one-liner); auto-generated notes are
      # appended below it. All five matrix jobs write the same body, which
      # softprops applies idempotently.
      - name: Release body from CHANGELOG
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 == "## " ver { hit = 1; next }
            /^## / { hit = 0 }
            hit { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "CHANGELOG.md has no \"## ${TAG#v}\" section" >&2
            exit 1
          fi
      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: libpowerio_capi.${{ matrix.triplet }}.tar.gz
          body_path: release-body.md
          generate_release_notes: true
          # Stage the release as a draft a human publishes: the release event
          # then has a user actor, so it actually triggers python.yml (the
          # GITHUB_TOKEN recursion guard swallows bot-published events), and
          # nothing ships until the maintainer clicks publish.
          draft: true

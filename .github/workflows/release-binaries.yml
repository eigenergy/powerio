name: Release binaries

# Build the powerio-capi cdylib (with arrow, matrix, gridfm, dist, and prob
# features) for the five platforms PowerIO.jl's Artifacts.toml covers, package
# each as the artifact tarball that file references (lib/ or bin/ layout, Julia
# platform triplet in the name), and attach them to the GitHub release on a
# version tag. A workflow_dispatch run builds the same tarballs as workflow
# artifacts only.
#
# After tagging, run PowerIO.jl's gen/update_artifacts.jl <tag> to rewrite its
# Artifacts.toml with the real sha256/git-tree-sha1 of these tarballs.
#
# linux builds run on ubuntu-22.04 for the older glibc floor (2.35); aarch64
# linux is cross-compiled so the job doesn't need an ARM runner label.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

# A moved, unpublished tag supersedes its previous build. Keep one run per
# ref so its assets cannot race another run for the same draft release.
concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release gate. PIO_ABI_VERSION does not cover document formats, so a
  # release can break the Julia binding while both ABI integers stay the
  # same. This job tests the tag against the default branch of PowerIO.jl.
  # It gates `build`: a failure makes no tarballs and no draft release.
  # For a planned binding break, merge the PowerIO.jl change first, then
  # run this workflow again on the tag.
  binding-gate:
    name: PowerIO.jl main against this tag
    # Tag pushes only. A workflow_dispatch run builds artifact-only
    # tarballs and attaches nothing to a release, so it has no gate. That
    # run is also the bypass for a planned binding break.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Probe PowerIO.jl access
      id: powerio-jl
      env:
        POWERIO_JL_TOKEN: ${{ secrets.POWERIO_JL_REPO_TOKEN }}
      run: |
        # Test the token now. An expired token would fail later in checkout
        # with an unclear error.
        if [ -n "${POWERIO_JL_TOKEN}" ] \
          && git ls-remote "https://x-access-token:${POWERIO_JL_TOKEN}@github.com/eigenergy/PowerIO.jl.git" HEAD >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif git ls-remote https://github.com/eigenergy/PowerIO.jl.git HEAD >/dev/null 2>&1; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          # Do not pass silently. On a release, an unreachable binding
          # means the gate did not run.
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Require the binding to be reachable
      if: steps.powerio-jl.outputs.available != 'true'
      run: |
        echo "::error::Cannot reach eigenergy/PowerIO.jl, so the release gate cannot run. \
        Set a valid POWERIO_JL_REPO_TOKEN to release. A workflow_dispatch run builds \
        artifact-only tarballs without the gate."
        exit 1
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Build powerio-capi
      run: |
        cargo build -p powerio-capi --release \
          --features arrow,matrix,gridfm,dist,prob
    - name: Check out PowerIO.jl default branch
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: eigenergy/PowerIO.jl
        path: PowerIO.jl
        token: ${{ secrets.POWERIO_JL_REPO_TOKEN || github.token }}
    - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3
      with:
        version: '1'
    - uses: julia-actions/cache@a45e8fa8be21c18a06b7177052533149e61e9b38 # v3
    - name: Test PowerIO.jl against this tag
      env:
        POWERIO_CAPI: ${{ github.workspace }}/target/release/libpowerio_capi.so
      run: |
        julia --project=PowerIO.jl -e 'using Pkg; Pkg.instantiate(); Pkg.test()' || {
          echo "::error::PowerIO.jl's default branch fails against this tag. Merge the \
          paired PowerIO.jl change, then re-run this workflow on the tag. A \
          workflow_dispatch run builds artifact-only tarballs without the gate."
          exit 1
        }

  build:
    needs: binding-gate
    # Run when the gate passed or was skipped, never when it failed. A
    # plain `needs:` would also skip this job on workflow_dispatch runs.
    if: always() && (needs.binding-gate.result == 'success' || needs.binding-gate.result == 'skipped')
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            triplet: x86_64-linux-gnu
            lib: libpowerio_capi.so
          - runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-gnu
            triplet: aarch64-linux-gnu
            lib: libpowerio_capi.so
            cross_gcc: gcc-aarch64-linux-gnu
          # Cross-compiled: the macos-13 x86_64 runners are retired, and an
          # arm64 runner with the x86_64 toolchain target links fine.
          - runner: macos-14
            rust_target: x86_64-apple-darwin
            triplet: x86_64-apple-darwin
            lib: libpowerio_capi.dylib
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            triplet: aarch64-apple-darwin
            lib: libpowerio_capi.dylib
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            triplet: x86_64-w64-mingw32
            lib: powerio_capi.dll
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.rust_target }}
      # The tarballs and the draft release are named for the tag, and PowerIO.jl
      # pins them by it. A tag pushed without the workspace version bump would
      # ship a library that calls itself the previous version, stamps it into
      # every document it writes, and serves its schema under the previous
      # lineage. crates.yml catches the mismatch, but only after a human has
      # published the release.
      - name: Check the tag against the workspace version
        if: github.event_name == 'push'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-tag-check.sh
      - name: Install cross linker
        if: matrix.cross_gcc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_gcc }} qemu-user
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build powerio-capi
        run: cargo build -p powerio-capi --release --features arrow,matrix,gridfm,dist,prob --target ${{ matrix.rust_target }}
      # Artifact layout PowerIO.jl's _artifact_lib() resolves: the cdylib under
      # lib/ (bin/ on Windows, renamed to the lib-prefixed name BinaryBuilder
      # would produce), the C header under include/, licenses at the root.
      - name: Package tarball
        shell: bash
        run: |
          stage=stage/libpowerio_capi
          built="target/${{ matrix.rust_target }}/release/${{ matrix.lib }}"
          case "${{ matrix.triplet }}" in
            *-mingw32)
              mkdir -p "$stage/bin"
              cp "$built" "$stage/bin/libpowerio_capi.dll"
              ;;
            *)
              mkdir -p "$stage/lib"
              cp "$built" "$stage/lib/${{ matrix.lib }}"
              ;;
          esac
          mkdir -p "$stage/include"
          cp powerio-capi/include/powerio.h "$stage/include/"
          cp LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "libpowerio_capi.${{ matrix.triplet }}.tar.gz" -C "$stage" .
          python3 scripts/audit-release-archives.py \
            "libpowerio_capi.${{ matrix.triplet }}.tar.gz"
          # informational; gen/update_artifacts.jl recomputes from the release assets
          shasum -a 256 "libpowerio_capi.${{ matrix.triplet }}.tar.gz" \
            || sha256sum "libpowerio_capi.${{ matrix.triplet }}.tar.gz"
      - name: Runtime smoke test packaged Unix library
        if: matrix.triplet != 'x86_64-w64-mingw32'
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "powerio-capi") | .version')"
          stage="stage/libpowerio_capi"
          defs=(-DPIO_ARROW -DPIO_MATRIX -DPIO_GRIDFM -DPIO_DIST -DPIO_PROB)
          case "${{ matrix.triplet }}" in
            x86_64-linux-gnu)
              # shellcheck disable=SC2016
              cc "${defs[@]}" -I "$stage/include" powerio-capi/examples/release_smoke.c \
                -L "$stage/lib" -lpowerio_capi \
                -Wl,-rpath,'$ORIGIN/stage/libpowerio_capi/lib' -o release-smoke
              ./release-smoke "$version"
              ;;
            aarch64-linux-gnu)
              # shellcheck disable=SC2016
              aarch64-linux-gnu-gcc "${defs[@]}" -I "$stage/include" \
                powerio-capi/examples/release_smoke.c \
                -L "$stage/lib" -lpowerio_capi \
                -Wl,-rpath,'$ORIGIN/stage/libpowerio_capi/lib' -o release-smoke
              qemu-aarch64 -L /usr/aarch64-linux-gnu ./release-smoke "$version"
              ;;
            x86_64-apple-darwin)
              /usr/sbin/softwareupdate --install-rosetta --agree-to-license
              cc -arch x86_64 "${defs[@]}" -I "$stage/include" \
                powerio-capi/examples/release_smoke.c \
                -L "$stage/lib" -lpowerio_capi \
                -Wl,-rpath,@executable_path/stage/libpowerio_capi/lib \
                -o release-smoke
              arch -x86_64 ./release-smoke "$version"
              ;;
            aarch64-apple-darwin)
              cc -arch arm64 "${defs[@]}" -I "$stage/include" \
                powerio-capi/examples/release_smoke.c \
                -L "$stage/lib" -lpowerio_capi \
                -Wl,-rpath,@executable_path/stage/libpowerio_capi/lib \
                -o release-smoke
              arch -arm64 ./release-smoke "$version"
              ;;
          esac
      - name: Runtime smoke test packaged Windows library
        if: matrix.triplet == 'x86_64-w64-mingw32'
        shell: pwsh
        run: |
          # cargo reaches the MSVC toolset through the cc crate, but a bare
          # cl.exe is not on PATH until the developer shell is entered.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw 'no Visual Studio C++ toolset on this runner' }
          Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
            -DevCmdArguments '-arch=x64 -host_arch=x64'
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object { $_.name -eq 'powerio-capi' }).version
          $defines = @('/DPIO_ARROW', '/DPIO_MATRIX', '/DPIO_GRIDFM', '/DPIO_DIST', '/DPIO_PROB')
          $importLib = Get-ChildItem target/${{ matrix.rust_target }}/release -Filter '*powerio_capi*.dll.lib' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $importLib) { throw 'powerio-capi import library is missing' }
          cl.exe /nologo /std:c11 $defines /Istage/libpowerio_capi/include `
            powerio-capi/examples/release_smoke.c `
            $importLib `
            /Fe:release-smoke.exe
          Copy-Item stage/libpowerio_capi/bin/libpowerio_capi.dll powerio_capi.dll
          ./release-smoke.exe $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libpowerio_capi.${{ matrix.triplet }}
          path: libpowerio_capi.${{ matrix.triplet }}.tar.gz

  attach:
    name: attach draft release assets
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify the tag still names this build
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Annotated tags resolve through ^{}; lightweight tags name the
          # commit directly. A missing or moved tag must attach no assets.
          refs="$(git ls-remote --tags origin "$RELEASE_REF" "${RELEASE_REF}^{}")"
          tag_sha="$(printf '%s\n' "$refs" | awk '$2 !~ /\^\{\}$/ { print $1 }')"
          peeled_sha="$(printf '%s\n' "$refs" | awk '$2 ~ /\^\{\}$/ { print $1 }')"
          current_sha="${peeled_sha:-$tag_sha}"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Release tag moved or disappeared while this build ran."
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: libpowerio_capi.*
          path: release-assets
          merge-multiple: true
      # The draft release body is the CHANGELOG section for this version (the
      # v0.0.1 release shipped with a bare one-liner); auto-generated notes are
      # appended below it.
      - name: Release body from CHANGELOG
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v ver="${TAG#v}" '
            $0 == "## " ver { hit = 1; next }
            /^## / { hit = 0 }
            hit { print }
          ' CHANGELOG.md > release-body.md
          if ! [ -s release-body.md ]; then
            echo "CHANGELOG.md has no \"## ${TAG#v}\" section" >&2
            exit 1
          fi
          asset_count="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$asset_count" != 5 ]; then
            echo "expected five release assets, found $asset_count" >&2
            exit 1
          fi
      - name: Attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release-assets/*.tar.gz
          body_path: release-body.md
          generate_release_notes: true
          # Stage the release as a draft a human publishes: the release event
          # then has a user actor, so it actually triggers python.yml (the
          # GITHUB_TOKEN recursion guard swallows bot-published events), and
          # nothing ships until the maintainer clicks publish.
          draft: true

name: Docs

# Build the workspace rustdoc and publish it to GitHub Pages. This renders all
# eight library crates, including powerio-capi and powerio-py (publish = false),
# whose //! docs docs.rs would never host. docs.rs takes over for the published
# crates (powerio, powerio-core, powerio-matrix, powerio-prob, powerio-dist,
# retired crates) once they reach crates.io.
# PRs build the docs too (so a broken intra-doc link fails review, not main),
# but only push to main / dispatch deploys to Pages; see the `deploy` gate.
on:
  push:
    branches: [ "main" ]
  # No branch filter: stacked PRs must run this too (see rust.yml).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize per ref. On main, queue rather than cancel: a cancelled in-flight
# Pages deployment can leave the backend rejecting the next deployment
# ("Deployment failed, try again later"), so successive main pushes must each
# deploy in order. A pull request run never deploys (see the `deploy` gate),
# so a superseded one is cancelled like the other pull request workflows.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - name: Install mdBook
      run: cargo install mdbook --version 0.5.2 --locked
    - name: Terminology gate
      run: bash scripts/terminology-gate.sh
    # -D warnings turns a broken intra-doc link into a failed build, so the docs
    # can't rot silently. --all-features renders each feature gated surface.
    - name: Build docs
      env:
        RUSTDOCFLAGS: "-D warnings"
      run: cargo doc --no-deps --all-features -p powerio -p powerio-core -p powerio-tx -p powerio-matrix -p powerio-prob -p powerio-dist -p powerio-capi -p powerio-py
    - name: Build Python API docs
      run: |
        python -m pip install --upgrade pip
        python -m pip install '.[all]' pdoc
        python -m pdoc powerio -o target/doc/python
    - name: Build book
      run: mdbook build docs --dest-dir target/doc/guide
    # CONTRIBUTING.md requires `mdbook test docs`; without this step a broken
    # code block in the book merges silently.
    - name: Test book
      run: mdbook test docs
    # The landing page separates the doc deployments so neither shadows the
    # other: docs.rs renders crates.io releases, while this site renders main
    # rustdoc, the Python API reference, and the mdBook guide.
    - name: Landing page
      run: |
        mkdir -p target/doc/_assets
        cp docs/src/assets/powerio-logo.svg target/doc/_assets/
        cat > target/doc/index.html <<'HTML'
        <!doctype html>
        <html lang="en">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PowerIO docs</title>
        <link rel="icon" href="_assets/powerio-logo.svg">
        <style>
          :root {
            --bg:#faf8f4; --fg:#26221b; --muted:#76705f;
            --rust:#b7410e; --line:#e4ded2;
          }
          @media (prefers-color-scheme: dark) {
            :root {
              --bg:#15120e; --fg:#e9e3d5; --muted:#9d958a;
              --rust:#e0773f; --line:#2d2820;
            }
          }
          html { border-top: 3px solid var(--rust); }
          body {
            font-family: "Charter", "Georgia", serif; font-size: 1.0625rem;
            color: var(--fg); background: var(--bg);
            max-width: 600px; margin: 5rem auto 4rem; padding: 0 1.5rem; line-height: 1.6;
          }
          header { display: flex; align-items: center; gap: .9rem; margin-bottom: .4rem; }
          header img { width: 52px; height: 52px; }
          h1 { margin: 0; font-size: 1.7rem; font-weight: 600; letter-spacing: -.01em; }
          .tagline { color: var(--muted); font-style: italic; margin: 0 0 2.6rem; }
          dl { margin: 0; }
          dl > div {
            display: grid; grid-template-columns: 10.5rem 1fr; gap: 0 1.5rem;
            padding: .9rem 0; border-top: 1px solid var(--line);
          }
          dt {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: .78rem; color: var(--muted); padding-top: .3rem;
          }
          dd { margin: 0; display: flex; flex-wrap: wrap; column-gap: 1.5rem; row-gap: .25rem; }
          a { color: var(--rust); text-decoration: none; }
          a:hover { text-decoration: underline; text-underline-offset: 3px; }
          footer {
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: .78rem; border-top: 1px solid var(--line); padding-top: .9rem;
          }
          footer a { color: var(--muted); }
          @media (max-width: 560px) {
            dl > div { grid-template-columns: 1fr; }
            dt { padding-top: 0; }
          }
        </style>
        <header>
          <img src="_assets/powerio-logo.svg" alt="PowerIO logo">
          <h1>PowerIO docs</h1>
        </header>
        <p class="tagline">Case parsing, conversion, matrices, and language bindings.</p>
        <dl>
          <div>
            <dt>released / docs.rs</dt>
            <dd><a href="https://docs.rs/powerio">powerio</a>
                <a href="https://docs.rs/powerio-core">powerio-core</a>
                <a href="https://docs.rs/powerio-matrix">powerio-matrix</a>
                <a href="https://docs.rs/powerio-prob">powerio-prob</a>
                <a href="https://docs.rs/powerio-dist">powerio-dist</a></dd>
          </div>
          <div>
            <dt>development / main</dt>
            <dd><a href="powerio/index.html">powerio</a>
                <a href="powerio_core/index.html">powerio-core</a>
                <a href="powerio_matrix/index.html">powerio-matrix</a>
                <a href="powerio_prob/index.html">powerio-prob</a>
                <a href="powerio_dist/index.html">powerio-dist</a>
                <a href="powerio_capi/index.html">powerio-capi</a>
                <a href="python/powerio.html">python</a></dd>
          </div>
          <div>
            <dt>guide</dt>
            <dd><a href="guide/index.html">overview</a>
                <a href="guide/format-fidelity.html">format fidelity</a>
                <a href="guide/matrices.html">matrices</a>
                <a href="guide/dcopf-bundle.html">DC OPF bundle</a>
                <a href="guide/capi.html">C ABI</a>
                <a href="guide/migration-v1.html">migrating</a>
                <a href="guide/languages.html">language APIs</a>
                <a href="guide/python.html">python</a></dd>
          </div>
          <div>
            <dt>PowerIO IR</dt>
            <dd><a href="guide/pio-json-schema.html">field reference</a>
                <a href="guide/compiler-ir.html">compiler IR</a></dd>
          </div>
          <div>
            <dt>bindings</dt>
            <dd><a href="https://eigenergy.github.io/PowerIO.jl/dev/">PowerIO.jl</a></dd>
          </div>
        </dl>
        <footer><a href="https://github.com/eigenergy/powerio">github.com/eigenergy/powerio</a></footer>
        HTML
    # The published schema document's `$id` names a path on this site, so the
    # path serves the machine-readable schema and redirects browsers to the
    # format chapter. Relative targets keep the redirects working under both
    # powerio.dev and eigenergy.github.io/powerio.
    - name: Schema identifier pages
      run: |
        redirect_schema_page() {
          # A redirect to a missing anchor would land at the page top; fail
          # the build instead.
          anchor="${1%/*}"
          grep -q "id=\"$anchor\"" target/doc/guide/pio-json-schema.html
          target="../../../guide/pio-json-schema.html#$anchor"
          mkdir -p "target/doc/schema/$1"
          test -f "docs/schema/$1/schema.json"
          cp "docs/schema/$1/schema.json" "target/doc/schema/$1/schema.json"
          cat > "target/doc/schema/$1/index.html" <<HTML
        <!doctype html>
        <meta charset="utf-8">
        <meta http-equiv="refresh" content="0; url=$target">
        <title>$1</title>
        <a href="$target">$1</a>
        HTML
        }
        redirect_schema_page "pio-module/1"
    - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
      with:
        path: target/doc

  deploy:
    needs: build
    # PR runs build to catch doc breakage but never publish; only main / dispatch deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

name: Rust

on:
  push:
    branches: [ "main" ]
  # No branch filter on pull_request: stacked PRs target another PR's branch,
  # and retargeting to main after the parent merges fires only `edited`, which
  # never re-triggers filtered workflows. Run on every PR instead.
  pull_request:

# One run per workflow per branch. A force push to a stacked pull request
# otherwise leaves the superseded run going: it finishes, it fails or it
# passes, and it emails every watcher a second time for a commit nobody is
# reviewing.
#
# Only a pull request run is ever superseded, so only a pull request run is
# cancelled. A push to `main` is a release candidate whose result must stand
# on its own, and a release run is the release itself: `python.yml` publishes
# wheels to PyPI from one, behind an environment whose reviewer gate can hold
# it for a long time. Keying the switch on the ref instead would make every
# tag run cancellable, and a re-published release or a re-run of the same tag
# would then cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  encoding:
    name: Encoding (no BOM, no mojibake)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    # Windows editors have twice corrupted text files in PRs: CRLF in vendored
    # fixtures (#73, now pinned via .gitattributes) and UTF-8 re-encoded as
    # cp1252 plus a BOM (#77). .gitattributes can't catch the latter two, so
    # reject them here. tests/data is exempt: vendored fixtures keep their
    # committed bytes.
    - name: No UTF-8 BOM
      run: |
        if git grep -Iln $'\xef\xbb\xbf' -- .; then
          echo "UTF-8 BOM found in the files above"; exit 1
        fi
    - name: No cp1252 mojibake
      run: |
        if git grep -Iln $'\xc3\xa2' -- ':!tests/data'; then
          echo "mojibake (UTF-8 read as cp1252 and re-encoded) found in the files above"; exit 1
        fi
    # A path component whose stem is a reserved DOS device name (aux, con, nul,
    # prn, com1-9, lpt1-9), ends in a dot or space, or contains <>:"\|?* cannot
    # be checked out on Windows. Only the release workflow runs a Windows job,
    # so without this gate the breakage surfaces at tag time (v0.2.0 failed on
    # powerworld/aux.rs).
    - name: Windows-checkoutable paths
      run: |
        git ls-files | awk -F/ '{
          if ($0 ~ /[<>:"\\|?*]/) { print; bad=1; next }
          for (i = 1; i <= NF; i++) {
            c = tolower($i); sub(/\..*$/, "", c)
            if (c ~ /^(con|prn|aux|nul|com[1-9]|lpt[1-9])$/ || $i ~ /[. ]$/) { print; bad=1; break }
          }
        } END { exit bad }' || {
          echo "the paths above cannot be checked out on Windows"; exit 1
        }

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    # The tree is rustfmt-clean (style_edition 2024); keep it that way.
    - name: Check formatting
      run: cargo fmt --all --check

  # Own job so a stale schema fails in parallel with clippy and the tests
  # instead of masking them (the #255 merge failure hid both).
  schemas:
    name: Generated schemas match
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Check generated JSON schemas
      # `git status --porcelain` rather than `git diff`: a version bump moves
      # the lineage, so the generator writes a NEW directory, and a diff of
      # tracked files reports nothing while the document goes uncommitted.
      run: |
        cargo run -p powerio --example generate_schemas --features schema -- docs/schema
        if [ -n "$(git status --porcelain -- docs/schema)" ]; then
          git status --porcelain -- docs/schema
          git diff -- docs/schema
          echo "docs/schema is stale or missing this build's lineage; commit it" >&2
          exit 1
        fi
    - name: Check generated BMOPF examples
      run: cargo run -p powerio-dist --example regen_bmopf_examples -- --check

  archives:
    name: Published crate archives
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - name: Build publishable crate archives
      run: cargo package --workspace --exclude powerio-capi --exclude powerio-py --locked --no-verify
    - name: Audit licenses and excluded fixtures
      run: python3 scripts/audit-release-archives.py target/package/*.crate

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose
    # Deny the workspace pedantic lints on the non-extension crates. The PyO3
    # ext crates are linted in the Python workflow with their feature enabled.
    - name: Clippy
      run: bash scripts/ci-clippy.sh workspace
    - name: Terminology gate
      run: bash scripts/terminology-gate.sh
    - name: Documentation symbols
      run: python3 scripts/check-doc-symbols.py
    - name: Architecture map
      run: python3 scripts/check-architecture-map.py
    - name: No deprecated items
      run: bash scripts/deprecated-inventory.sh --assert-empty
    # The release decision paths a tag event would run, exercised on every
    # pull request without writing anything.
    - name: Release preflight
      run: bash scripts/release-preflight.sh
    # Bare `cargo test` only covers the default-members; name the C ABI crate
    # explicitly so its end-to-end ABI tests run in CI too.
    - name: Run tests
      run: cargo test -p powerio -p powerio-tx -p powerio-core -p powerio-matrix -p powerio-prob -p powerio-cli -p powerio-capi -p powerio-dist --verbose
    - name: Test problem matrix feature
      run: cargo test -p powerio --features matrix --verbose
    - name: Test gridfm reader feature
      run: cargo test -p powerio --features gridfm --verbose
    - name: Check problem dependency boundaries
      run: |
        cargo check -p powerio-prob --no-default-features
        if cargo tree -p powerio-prob --no-default-features --edges normal | grep -q powerio-matrix; then
          echo "powerio-prob reaches powerio-matrix" >&2; exit 1
        fi
    # The gridfm Parquet export is behind a cargo feature; exercise it (and its
    # clippy) explicitly so coverage doesn't depend on CLI feature unification.
    - name: Clippy + tests (gridfm feature)
      run: |
        bash scripts/ci-clippy.sh matrix-gridfm
        cargo test -p powerio-matrix --features gridfm --verbose

  # The no-replace output commit has one implementation per platform
  # (renamex_np, renameat2, MoveFileExW); its refusal tests and the C smoke's
  # directory-write collision assertion run on every platform that ships one.
  output-commit-platforms:
    name: output commit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Test powerio-core
      run: cargo test -p powerio-core --verbose
    - name: Build powerio-capi (dist feature)
      run: cargo build -p powerio-capi --release --features dist
    - name: Compile and run the C smoke test (Unix)
      if: runner.os == 'macOS'
      run: |
        cc -DPIO_DIST -I powerio-capi/include powerio-capi/examples/smoke.c            -L target/release -lpowerio_capi -o pio_smoke
        DYLD_LIBRARY_PATH=target/release ./pio_smoke tests/data/case9.m
    - name: Compile and run the C smoke test (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # cargo reaches the MSVC toolset through the cc crate, but a bare
        # cl.exe is not on PATH until the developer shell is entered.
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $vsPath) { throw 'no Visual Studio C++ toolset on this runner' }
        Import-Module "$vsPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
        Enter-VsDevShell -VsInstallPath $vsPath -SkipAutomaticLocation `
          -DevCmdArguments '-arch=x64 -host_arch=x64'
        $importLib = Get-ChildItem target/release -Filter '*powerio_capi*.dll.lib' |
          Select-Object -First 1 -ExpandProperty FullName
        if (-not $importLib) { throw 'powerio-capi import library is missing' }
        cl.exe /nologo /std:c11 /DPIO_DIST /Ipowerio-capi/include `
          powerio-capi/examples/smoke.c `
          $importLib `
          /Fe:pio_smoke.exe
        Copy-Item target/release/powerio_capi.dll .
        ./pio_smoke.exe tests/data/case9.m

  wasm32:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@v2
    - name: Check wasm32 component crates
      run: |
        cargo check --target wasm32-unknown-unknown -p powerio -p powerio-tx -p powerio-dist \
          -p powerio-core -p powerio-prob -p powerio-matrix
        cargo check --target wasm32-unknown-unknown -p powerio --features matrix

  c-abi:
    name: C ABI (core no-default + C smoke test)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # The export monotonicity gate compares this head against its stack
        # parent, which a shallow clone cannot reach.
        fetch-depth: 0
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi --no-default-features
      run: cargo build -p powerio-capi --release --no-default-features
    # Every `pio_` export in the Rust source must be declared in the checked-in
    # header, so a new, renamed, or removed entry point can't silently drift out
    # of sync with include/powerio.h.
    - name: Header symbol parity
      run: bash scripts/capi-header-parity.sh
    # The abi-v6 removed-surface enumeration must equal the v0.9.0 -> current
    # header set difference; this job's full-history checkout has the tag.
    - name: Removed surface enumeration
      run: bash scripts/capi-removed-surface.sh
    - name: ABI delta and necessity
      run: python3 scripts/abi-delta.py
    - name: Value kind parity
      run: bash scripts/check-value-kinds.sh
    - name: Diagnostic parity
      run: bash scripts/check-diagnostic-parity.sh
    # Doc comments render verbatim into powerio.h; check they agree with the
    # signatures, table ids, and ownership verbs they describe.
    - name: Doc comment integrity
      run: python3 scripts/capi-doc-integrity.py
    # A declared entry point may leave the header only on a head that raises
    # PIO_ABI_VERSION. This job has no PowerIO.jl checkout; the companion
    # clause runs in julia-binding.yml, which has both trees.
    - name: Export monotonicity
      run: POWERIO_JL_OPTIONAL=1 bash scripts/capi-export-monotonicity.sh
    # Symbol parity compares names only. Regenerating and diffing catches what
    # names can't: a reordered argument, a changed type, a struct field. cbindgen
    # gates optional features behind #ifdef, so one run covers every feature set
    # and this step belongs in exactly one job.
    - name: Install cbindgen
      run: cargo install cbindgen --locked
    - name: Header matches cbindgen output
      run: bash scripts/capi-header-regen.sh
    # Drive the ABI from C against the built library: proves the header is valid
    # C, the symbols link, and the exercised signatures match. Dynamic-linked so
    # the platform resolves the Rust runtime deps.
    - name: Compile and run the C smoke test
      run: |
        cc -I powerio-capi/include powerio-capi/examples/smoke.c \
           -L target/release -lpowerio_capi -o pio_smoke
        LD_LIBRARY_PATH=target/release ./pio_smoke tests/data/case9.m
    # The same smoke under address and undefined behavior sanitizers: the ABI
    # v6 ownership paths (retain/release orders, spans after parent release)
    # must be clean, not merely not crash.
    - name: C smoke test under ASan and UBSan
      run: |
        clang -fsanitize=address,undefined -fno-sanitize-recover=all \
           -I powerio-capi/include powerio-capi/examples/smoke.c \
           -L target/release -lpowerio_capi -o pio_smoke_san
        LD_LIBRARY_PATH=target/release ./pio_smoke_san tests/data/case9.m
    # A small Go client drives the same ownership paths through cgo, so the
    # handle rules hold from a third runtime.
    - uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Go client exercises the ABI ownership paths
      run: |
        cd powerio-capi/examples/go-client
        CGO_CFLAGS="-I $GITHUB_WORKSPACE/powerio-capi/include" \
        CGO_LDFLAGS="-L $GITHUB_WORKSPACE/target/release -lpowerio_capi" \
        go run . "$GITHUB_WORKSPACE/tests/data/case9.m"
      env:
        LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
    - name: Compile and run the C++ header sanity check
      run: |
        c++ -std=c++17 -I powerio-capi/include powerio-capi/examples/header_cpp.cpp \
           -L target/release -lpowerio_capi -o pio_header_cpp
        LD_LIBRARY_PATH=target/release ./pio_header_cpp
    - name: Tests + clippy (core no-default)
      run: |
        cargo test -p powerio-capi --no-default-features --verbose
        bash scripts/ci-clippy.sh capi-no-default

  capi-miri:
    name: Miri (C ABI handle core)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: miri
    - uses: Swatinem/rust-cache@v2
    # The unsafe ownership helpers behind every ABI v6 handle, under Miri.
    # FFI entry points cannot run under Miri; the pure handle core can.
    - name: Miri over the handle lifecycle
      run: cargo +nightly miri test -p powerio-capi handle_lifecycle_is_sound

  c-abi-arrow:
    name: C ABI (arrow feature)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi --features arrow
      run: cargo build -p powerio-capi --release --features arrow
    # The cfg-gated pio_to_arrow still appears in the source symbol grep, so
    # it must be declared in the header (inside #ifdef PIO_ARROW); parity holds.
    - name: Header symbol parity
      run: bash scripts/capi-header-parity.sh
    # Compile the smoke test with -DPIO_ARROW so it exercises the Arrow C Data
    # Interface export against the arrow-featured library.
    - name: Compile and run the C smoke test (arrow)
      run: |
        cc -DPIO_ARROW -I powerio-capi/include powerio-capi/examples/smoke.c \
           -L target/release -lpowerio_capi -o pio_smoke_arrow
        LD_LIBRARY_PATH=target/release ./pio_smoke_arrow tests/data/case9.m
    - name: Tests + clippy (arrow feature)
      run: |
        cargo test -p powerio-capi --features arrow --verbose
        bash scripts/ci-clippy.sh capi-arrow

  c-abi-gridfm:
    name: C ABI (release features)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi --features arrow,matrix,gridfm,dist,prob
      run: cargo build -p powerio-capi --release --features arrow,matrix,gridfm,dist,prob
    # The cfg-gated optional symbols still appear in the source symbol grep,
    # so they must be declared in the header (inside their PIO_* guards);
    # parity holds for the release feature set.
    - name: Header symbol parity
      run: bash scripts/capi-header-parity.sh
    # Compile the smoke test with every optional PIO_* define so it exercises
    # the same C surface the release artifacts export.
    - name: Compile and run the C smoke test (release features)
      run: |
        rm -rf /tmp/pio-gridfm-smoke
        cargo run -p powerio-cli -- gridfm tests/data/case9.m -o /tmp/pio-gridfm-smoke
        cc -DPIO_ARROW -DPIO_MATRIX -DPIO_GRIDFM -DPIO_DIST -DPIO_PROB \
           -I powerio-capi/include powerio-capi/examples/smoke.c \
           -L target/release -lpowerio_capi -o pio_smoke_gridfm
        LD_LIBRARY_PATH=target/release ./pio_smoke_gridfm tests/data/case9.m /tmp/pio-gridfm-smoke/case9/raw
    - name: Compile and run the C++ header sanity check (release features)
      run: |
        c++ -std=c++17 -DPIO_ARROW -DPIO_MATRIX -DPIO_GRIDFM -DPIO_DIST -DPIO_PROB \
           -I powerio-capi/include powerio-capi/examples/header_cpp.cpp \
           -L target/release -lpowerio_capi -o pio_header_cpp_release
        LD_LIBRARY_PATH=target/release ./pio_header_cpp_release
    - name: Tests + clippy (release features)
      run: |
        cargo test -p powerio-capi --features arrow,matrix,gridfm,dist,prob --verbose
        bash scripts/ci-clippy.sh capi-release

  c-abi-dist:
    name: C ABI (dist feature)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi --features dist
      run: cargo build -p powerio-capi --release --features dist
    # The cfg-gated pio_dist_* entry points still appear in the source symbol
    # grep, so they must be declared in the header (inside #ifdef PIO_DIST);
    # parity holds.
    - name: Header symbol parity
      run: bash scripts/capi-header-parity.sh
    # Compile the smoke test with -DPIO_DIST so it exercises the distribution
    # entry points against the dist-featured library.
    - name: Compile and run the C smoke test (dist)
      run: |
        cc -DPIO_DIST -I powerio-capi/include powerio-capi/examples/smoke.c \
           -L target/release -lpowerio_capi -o pio_smoke_dist
        LD_LIBRARY_PATH=target/release ./pio_smoke_dist tests/data/case9.m
    - name: Tests + clippy (dist feature)
      run: |
        cargo test -p powerio-capi --features dist --verbose
        bash scripts/ci-clippy.sh capi-dist

name: Python

on:
  push:
    branches: [ "main" ]
  # No branch filter: stacked PRs must run this too (see rust.yml).
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag to retry
        required: true
        type: string

# One run per workflow per branch. A force push to a stacked pull request
# otherwise leaves the superseded run going: it finishes, it fails or it
# passes, and it emails every watcher a second time for a commit nobody is
# reviewing.
#
# Only a pull request run is ever superseded, so only a pull request run is
# cancelled. A push to `main` is a release candidate whose result must stand
# on its own, and a release run is the release itself: `python.yml` publishes
# wheels to PyPI from one, behind an environment whose reviewer gate can hold
# it for a long time. Keying the switch on the ref instead would make every
# tag run cancellable, and a re-published release or a re-run of the same tag
# would then cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
  SOURCE_REF: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}

jobs:
  release-preflight:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0
      - name: Release identity agreement
        run: bash scripts/check-release-versions.sh
      - name: Verify the immutable published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG" >/dev/null \
            || { echo "invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null \
            || { echo "$RELEASE_TAG is not an origin tag" >&2; exit 1; }
          tag_commit="$(git rev-list -n1 "refs/tags/$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "checked out $head_commit, but $RELEASE_TAG names $tag_commit" >&2
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "powerio-py") | .version')"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi
          release="$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o "$release"
          jq -e '.draft == false' "$release" >/dev/null \
            || { echo "$RELEASE_TAG is not a published GitHub release" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            jq -e '.prerelease == false' "$release" >/dev/null \
              || { echo "manual recovery refuses prerelease $RELEASE_TAG" >&2; exit 1; }
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$head_commit" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `cargo clippy` at the root skips powerio-py (it's not in default-members),
      # so lint the extension explicitly with the same native features as wheels.
      - name: Clippy (powerio-py)
        run: bash scripts/ci-clippy.sh powerio-py

  # The Python-source gates: ruff (pinned rule set in ruff.toml), mypy over
  # the wrapper (mypy.ini), and stubtest comparing the hand-written stubs
  # against the built extension. The stubs declare the public typing surface
  # (`py.typed`), so a Rust-side rename fails here instead of shipping a
  # stale stub. Known by-design deviations live in python/stubtest_allowlist.txt.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install gates
        run: pip install ruff mypy
      - name: ruff
        run: ruff check --no-fix .
      # The `mcp` extra: the server module is inside the type gate, and mypy
      # fails on an import it cannot resolve.
      - name: Install powerio
        run: pip install '.[mcp]'
      - name: mypy
        run: python -m mypy python/powerio
      # stubtest runs from an empty directory: with the repo (or a venv) as
      # the working directory, mypy finds the package source twice — once via
      # site-packages and once by walking the cwd — and refuses the build.
      - name: stubtest
        run: |
          mkdir -p /tmp/stubtest-cwd
          cd /tmp/stubtest-cwd
          python -m mypy.stubtest powerio \
            --mypy-config-file "$GITHUB_WORKSPACE/mypy.ini" \
            --ignore-missing-stub \
            --allowlist "$GITHUB_WORKSPACE/python/stubtest_allowlist.txt"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # This job is the gridfm-absent build: compile the extension without the
      # gridfm cargo feature so `test_gridfm_absent_raises_clean_importerror` and
      # the `_require_gridfm()` ImportError fallback actually run (every other
      # job builds the full released wheel, where they skip).
      - name: Compile the gridfm feature out
        run: sed -i 's/features = \["extension-module", "gridfm"\]/features = ["extension-module"]/' pyproject.toml
      # `pip install .[all,mcp]` builds the extension via the maturin backend and
      # pulls scipy/numpy/networkx and Polars (matrix + graph tests) plus the MCP
      # SDK. The `mcp` extra carries a `python_version >= '3.10'` marker, so it
      # installs the SDK on 3.12 (test_mcp runs) and resolves to nothing on 3.9
      # (test_mcp skips). Quote the extras so the shell doesn't glob `[all,mcp]`.
      - name: Install powerio + test deps
        run: pip install '.[all,mcp]' pytest
      - name: Run tests
        run: pytest python/tests -q
      # The core import path: parse/emit import nothing but the
      # interpreter. Without the gridfm feature the wrapper must fail with a
      # clear ImportError, not an AttributeError from the missing native symbol.
      - name: Zero-dep parse path
        run: |
          python -m venv /tmp/zerodep
          /tmp/zerodep/bin/pip install .
          /tmp/zerodep/bin/python - <<'PY'
          import tempfile
          import sys, powerio
          m = powerio.parse("tests/data/case14.m")
          assert isinstance(m.value, powerio.BalancedNetwork)
          c = m.value
          assert m.emit("matpower").text == open("tests/data/case14.m").read()
          assert "numpy" not in sys.modules and "scipy" not in sys.modules
          assert not powerio._powerio._has_gridfm
          try:
              c.emit_gridfm(tempfile.mkdtemp(prefix="powerio-gridfm-"))
          except ImportError as e:
              assert "gridfm" in str(e)
          else:
              raise SystemExit("expected ImportError without the gridfm feature")
          PY

  goc3-reference:
    name: GOC3 reference data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Smart-DS/GO-3-data-model
          ref: 5472a2373f456cc7e9923cdd31be1d4345d9830f
          path: external/go3-data-model
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: GOCompetition/C3DataUtilities
          ref: bb5df337553b21ab8be89ae5f9106958541730d4
          path: external/c3-data-utilities
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: lanl-ansi/GOC3Benchmark.jl
          ref: 588f3566ab29df240622a9a98c758af1bfc66bb1
          path: external/goc3-benchmark
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install the pinned reference readers
        run: |
          pip install \
            'numpy==1.26.4' \
            'scipy==1.11.4' \
            'pandas==2.1.4' \
            'pydantic==1.10.26' \
            'networkx==3.2.1' \
            'psutil==5.9.8'
          pip install --no-deps ./external/go3-data-model ./external/c3-data-utilities
      - name: Validate with the GO-3 data model
        run: |
          python evals/validation/validate_goc3_reference.py \
            --benchmark-data external/goc3-benchmark/test/data \
            --powerio-problem tests/data/goc3/goc3_small.json \
            --powerio-solution tests/data/goc3/goc3_small_solution.json
      - name: Parse the D1, D2, and D3 benchmark files
        env:
          POWERIO_GOC3_REFERENCE_DATA: ${{ github.workspace }}/external/goc3-benchmark/test/data
        run: cargo test -p powerio --test goc3_reference -- --nocapture
      - name: Run the Challenge 3 data checks on D1, D2, and D3
        run: |
          for problem in external/goc3-benchmark/test/data/*.json; do
            case_name="${problem##*/}"
            python external/c3-data-utilities/check_data.py \
              --problem "$problem" \
              --parameters '{"do_opt_solves": false}' \
              --summary_csv "$RUNNER_TEMP/$case_name-summary.csv" \
              --summary_json "$RUNNER_TEMP/$case_name-summary.json" \
              --data_errors "$RUNNER_TEMP/$case_name-data-errors.txt" \
              --ignored_errors "$RUNNER_TEMP/$case_name-ignored-errors.txt" \
              --solution_errors "$RUNNER_TEMP/$case_name-solution-errors.txt" \
              > "$RUNNER_TEMP/$case_name-check.log"
            test ! -s "$RUNNER_TEMP/$case_name-data-errors.txt"
            test ! -s "$RUNNER_TEMP/$case_name-ignored-errors.txt"
            test ! -s "$RUNNER_TEMP/$case_name-solution-errors.txt"
          done
      - name: Check PowerIO's emitted solution with C3DataUtilities
        run: |
          python external/c3-data-utilities/check_data.py \
            --problem tests/data/goc3/goc3_small.json \
            --solution tests/data/goc3/goc3_small_solution.json \
            --parameters '{"do_opt_solves": false}' \
            --summary_csv "$RUNNER_TEMP/powerio-goc3-summary.csv" \
            --summary_json "$RUNNER_TEMP/powerio-goc3-summary.json" \
            --data_errors "$RUNNER_TEMP/powerio-goc3-data-errors.txt" \
            --ignored_errors "$RUNNER_TEMP/powerio-goc3-ignored-errors.txt" \
            --solution_errors "$RUNNER_TEMP/powerio-goc3-solution-errors.txt" \
            > "$RUNNER_TEMP/powerio-goc3-check.log"
          test ! -s "$RUNNER_TEMP/powerio-goc3-data-errors.txt"
          test ! -s "$RUNNER_TEMP/powerio-goc3-ignored-errors.txt"
          test ! -s "$RUNNER_TEMP/powerio-goc3-solution-errors.txt"

  # Build the same wheel users get, install the GridFM and pandas compatibility
  # extras, and run the Parquet read/write tests before merge and on main.
  test-gridfm:
    name: test (gridfm extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install maturin
        run: pip install maturin
      # Install a wheel (not `develop`): a regular site-packages install wins the
      # `import powerio` race against the repo's `powerio/` crate directory, where
      # an editable install would not.
      - name: Build the wheel
        run: maturin build --release --out dist
      - name: Install wheel + test deps
        run: |
          wheel=$(ls dist/*.whl)
          pip install "${wheel}[all,gridfm,pandas]" pytest
      # `_has_gridfm` is now true, so the @gridfm_only tests run instead of skipping.
      - name: Run gridfm tests
        run: pytest python/tests -q -k gridfm

  wheels:
    name: wheels (${{ matrix.platform.target }} on ${{ matrix.platform.runner }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: release-preflight
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64 }
          - { runner: ubuntu-latest,  target: aarch64 }
          # macos-13 (the last x86_64 image) is retired; maturin-action
          # cross-compiles the x86_64 wheel on the arm64 runner.
          - { runner: macos-14,       target: x86_64 }
          - { runner: macos-14,       target: aarch64 }
          - { runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Match the preflight release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-preflight.outputs.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "checked out $actual_sha, but release preflight verified $EXPECTED_SHA" >&2
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      # abi3-py39 → one wheel per platform covers Python 3.9+.
      - name: Build powerio wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-${{ matrix.platform.runner }}-${{ matrix.platform.target }}
          path: dist

  # Install and import every built wheel before anything can publish (#325):
  # a clean environment per platform installs the wheel with the `all` extra,
  # imports powerio, parses a case, verifies the reported version and schema
  # identity, narrows a typed module, builds one matrix, and checks the
  # stored document writes deterministically. Linux aarch64 runs under QEMU;
  # macOS x86_64 runs the cross compiled x86_64 wheel under Rosetta.
  wheel-smoke:
    name: wheel smoke (${{ matrix.platform.target }} on ${{ matrix.platform.runner }})
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: [ release-preflight, wheels ]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest,  target: x86_64,  artifact: wheels-ubuntu-latest-x86_64 }
          - { runner: ubuntu-latest,  target: aarch64, artifact: wheels-ubuntu-latest-aarch64 }
          - { runner: macos-14,       target: x86_64,  artifact: wheels-macos-14-x86_64 }
          - { runner: macos-14,       target: aarch64, artifact: wheels-macos-14-aarch64 }
          - { runner: windows-latest, target: x64,     artifact: wheels-windows-latest-x64 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      # Only the QEMU docker leg brings its own interpreter; every other leg,
      # the macOS arm64 one included, smokes natively and needs host Python.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ !(matrix.platform.runner == 'ubuntu-latest' && matrix.platform.target == 'aarch64') }}
        with:
          python-version: "3.12"
      - name: Enable QEMU emulation
        if: matrix.platform.runner == 'ubuntu-latest' && matrix.platform.target == 'aarch64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Smoke the aarch64 wheel under QEMU
        if: matrix.platform.runner == 'ubuntu-latest' && matrix.platform.target == 'aarch64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/io" -w /io \
            arm64v8/python:3.12-bookworm \
            bash -ec 'pip install --quiet "$(ls dist/*.whl)[all]" && python scripts/wheel-smoke.py'
      - name: Smoke the x86_64 wheel under Rosetta
        if: matrix.platform.runner == 'macos-14' && matrix.platform.target == 'x86_64'
        run: |
          arch -x86_64 /usr/bin/python3 -m venv smoke-venv
          arch -x86_64 smoke-venv/bin/python -m pip install --quiet "$(ls dist/*.whl)[all]"
          arch -x86_64 smoke-venv/bin/python scripts/wheel-smoke.py
      - name: Smoke the wheel natively
        if: >-
          !(matrix.platform.runner == 'ubuntu-latest' && matrix.platform.target == 'aarch64')
          && !(matrix.platform.runner == 'macos-14' && matrix.platform.target == 'x86_64')
        shell: bash
        run: |
          python -m venv smoke-venv
          if [ -x smoke-venv/bin/python ]; then py=smoke-venv/bin/python; else py=smoke-venv/Scripts/python.exe; fi
          "$py" -m pip install --quiet "$(ls dist/*.whl)[all]"
          "$py" scripts/wheel-smoke.py

  sdist:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    needs: release-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_REF }}
      - name: Match the preflight release commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.release-preflight.outputs.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "checked out $actual_sha, but release preflight verified $EXPECTED_SHA" >&2
            exit 1
          fi
      - name: Build powerio sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - name: Audit licenses and excluded fixtures
        run: python3 scripts/audit-release-archives.py dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    # release-binaries.yml stages each release as a draft a human publishes, so
    # the release event fires with a user actor (events from a workflow's
    # GITHUB_TOKEN are swallowed by the recursion guard). Manual dispatch is the
    # recovery path for a missed event. A prerelease still builds wheels and an
    # sdist as run artifacts, but never uploads them to PyPI.
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch'
    needs: [ release-preflight, lint, quality, test, test-gridfm, wheels, wheel-smoke, sdist ]
    runs-on: ubuntu-latest
    # Deployment protection (required reviewers, tag rules) lives on the pypi
    # environment in the repo settings, not in this file.
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - name: Check distributions
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          # A partially failed upload (e.g. wheels in, sdist rejected) is
          # recovered by re-running; already-uploaded files are skipped.
          skip-existing: true

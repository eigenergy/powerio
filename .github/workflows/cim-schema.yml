name: CIM schema

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'powerio*/**'
      - 'tests/data/dist/**'
      - 'evals/validation/cim_dist/**'
      - '.github/workflows/cim-schema.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the current CLI
        run: cargo build --locked -p powerio-cli
      - name: Install the pinned schema oracle
        run: |
          python -m venv .venv-cim
          .venv-cim/bin/python -m pip install -r evals/validation/cim_dist/requirements-cim.txt
      - name: Check false-pass regressions
        run: .venv-cim/bin/python -m unittest discover -s evals/validation/cim_dist -p 'test_*.py' -v
      - name: Check every committed fixture (no external corpus)
        run: |
          .venv-cim/bin/python evals/validation/cim_dist/schema_check.py \
            --powerio "$PWD/target/debug/powerio" --fixtures-only \
            --report target/cim-schema-report.md
      - name: Upload the fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cim-schema-fixtures
          path: target/cim-schema-report.md
          if-no-files-found: ignore

name: PowSybl interoperability

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "powerio/**"
      - "powerio-cli/**"
      - "powerio-core/**"
      - "powerio-prob/**"
      - "powerio-tx/**"
      - "evals/powsybl/**"
      - "tests/data/case9.m"
      - ".github/workflows/powsybl.yml"
  push:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  interoperability:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Check out PowSybl reference cases
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        repository: powsybl/powsybl-core
        ref: 0939bfcc2c0c094de907dc818dd688b4cbfb7281
        path: powsybl-core
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          cgmes/cgmes-conformity/src/main/resources/conformity/cas-2/MicroGrid/Type2_T2/CGMES_v2.4.15_MicroGridTestConfiguration_T2_Assembled_Complete_v2
          cgmes/cgmes-conformity/src/main/resources/conformity/cas-3-data-3.0.2/MicroGrid/BaseCase/MicroGrid-BaseCase-Merged
          iidm/iidm-serde/src/test/resources
          psse/psse-converter/src/test/resources/remoteControl.xiidm
          psse/psse-converter/src/test/resources/twoTerminalDc.xiidm
          psse/psse-converter/src/test/resources/five_bus_nodeBreaker_rev35.xiidm
          psse/psse-converter/src/test/resources/SwitchedShunt.raw
          psse/psse-converter/src/test/resources/ExampleVersion32_exported.raw
          psse/psse-converter/src/test/resources/IEEE_30_bus.raw
          psse/psse-converter/src/test/resources/twoSubstations_rev35.rawx
          psse/psse-model-test/src/main/resources/five_bus_nodeBreaker_rev35.raw
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: evals/powsybl/requirements.txt
    - name: Install PyPowSybl
      run: python -m pip install -r evals/powsybl/requirements.txt
    - name: Build PowerIO
      run: cargo build -p powerio-cli
    - name: Check PowerIO and PowSybl interoperability
      run: bash evals/powsybl/run.sh target/debug/powerio python "$GITHUB_WORKSPACE/powsybl-core"

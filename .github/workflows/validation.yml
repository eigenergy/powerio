name: Validation

# Cross-tool correctness gate: run evals/validation/run_validation.sh (the same pass/fail
# matrix the maintainer runs locally) and fail the PR on any regression. Only the
# machine independent correctness checks run here. The speed benchmarks are
# per-machine and stay a local on-demand task (evals/performance/render_tables.py
# splices their results into evals/performance/RESULTS.md).
#
# This pulls a Julia + Python oracle stack (PowerModels.jl, ExaPowerIO.jl,
# pandapower, egret), so it's heavier than the other jobs; the path filter keeps it
# off doc-only PRs. The fixtures are all vendored, so no large-case fetch is needed.
on:
  pull_request:
    paths:
      - "powerio/**"
      - "powerio-tx/**"
      - "powerio-core/**"
      - "powerio-dist/**"
      - "powerio-matrix/**"
      - "powerio-capi/**"
      - "powerio-prob/**"
      - "powerio-py/**"
      - "evals/**"
      - "evals/validation/**"
      - "tests/data/dist/**"
      - "powerio-dist/examples/**"
      - ".github/workflows/validation.yml"

# One run per workflow per branch. A force push to a stacked pull request
# otherwise leaves the superseded run going: it finishes, it fails or it
# passes, and it emails every watcher a second time for a commit nobody is
# reviewing.
#
# Only a pull request run is ever superseded, so only a pull request run is
# cancelled. A push to `main` is a release candidate whose result must stand
# on its own, and a release run is the release itself: `python.yml` publishes
# wheels to PyPI from one, behind an environment whose reviewer gate can hold
# it for a long time. Keying the switch on the ref instead would make every
# tag run cancellable, and a re-published release or a re-run of the same tag
# would then cancel a publish in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Build powerio-capi
      run: cargo build --release -p powerio-capi
    - uses: julia-actions/setup-julia@v3
      with:
        version: '1'
    - uses: julia-actions/cache@v3
    - name: Instantiate the Julia oracle env
      run: julia --project=evals/validation -e 'using Pkg; Pkg.instantiate()'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    # Cache the pip wheels (pandapower + scipy/numpy, egret + pyomo, matpowercaseframes);
    # setup-python's own cache only covers the interpreter, not site-packages. Keyed on
    # the requirements file so a dependency bump re-resolves.
    - uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: pip-validate-${{ runner.os }}-${{ hashFiles('evals/validation/requirements.txt') }}
        restore-keys: pip-validate-${{ runner.os }}-
    # run_validation.sh defaults to .venv/bin/python when it is Python 3.11+.
    # Build the powerio wheel into that venv and add the Python oracles.
    - name: Build the powerio wheel and oracles into .venv
      env:
        VIRTUAL_ENV: ${{ github.workspace }}/.venv
      run: |
        python -m venv .venv
        .venv/bin/pip install --upgrade pip maturin
        .venv/bin/maturin develop --release
        .venv/bin/pip install -r evals/validation/requirements.txt
    # The validation script also checks this, but keep the failure close to the
    # setup step.
    - name: Verify the oracle stack imports
      run: .venv/bin/python -c "import egret, jsonschema, opendssdirect, pandapower, pypsa"
    - name: Run the validation matrix
      run: bash evals/validation/run_validation.sh
    - name: Compare explicit BMOPF core admittances with OpenDSS
      run: |
        cargo build --release -p powerio-cli
        .venv/bin/python evals/validation/validate_bmopf_core_shunts.py --powerio "$PWD/target/release/powerio"

name: Python package publisher

on:
  workflow_run:
    workflows: ["Python"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  verify-release:
    name: Validate release publishing eligibility
    if: ${{ github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'release' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      publishable: ${{ steps.verify.outputs.publishable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Download verified publication metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: metadata
      - name: Verify the source tag and stable release
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          tag="$(cat metadata/tag)"
          source_sha="$(cat metadata/sha)"
          metadata_prerelease="$(cat metadata/prerelease)"
          git check-ref-format "refs/tags/$tag" >/dev/null \
            || { echo "invalid release tag: $tag" >&2; exit 1; }
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          tag_sha="$(git rev-list -n1 "refs/tags/$tag")"
          if [ "$source_sha" != "$tag_sha" ]; then
            echo "metadata source $source_sha does not match $tag ($tag_sha)" >&2
            exit 1
          fi
          release="$RUNNER_TEMP/release.json"
          curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
            -o "$release"
          jq -e --arg tag "$tag" '.tag_name == $tag and .draft == false' "$release" >/dev/null \
            || { echo "$tag is not a published GitHub release" >&2; exit 1; }
          api_prerelease="$(jq -r '.prerelease' "$release")"
          if [ "$metadata_prerelease" != "$api_prerelease" ]; then
            echo "release prerelease metadata does not match the verified GitHub release" >&2
            exit 1
          fi
          if [ "$api_prerelease" = true ]; then
            echo "$tag is a prerelease; package publication is not applicable."
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Verified stable release $tag at $source_sha (event: $RUN_EVENT)."
          echo "publishable=true" >> "$GITHUB_OUTPUT"

  publish:
    name: publish to PyPI
    needs: verify-release
    if: ${{ needs.verify-release.outputs.publishable == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download platform wheels from the validated Python workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
          merge-multiple: true
      - name: Download source distribution from the validated Python workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

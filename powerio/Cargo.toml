[package]
name = "powerio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = 'Compiler infrastructure for power systems: parse, validate, transform, and emit grid models'
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/powerio"
keywords = ["matpower", "parser", "lossless"]
categories = ["science", "parsing"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["sincal"]
# Native SINCAL projects: the balanced and conductor-resolved readers, the
# byte-exact native echo, and the experimental writer. It brings in SQLite
# through powerio-tnd, so a wasm32 build with it needs a C compiler with
# a WebAssembly backend. `default-features = false` leaves it out; the facade
# then lists no SINCAL format and refuses a SINCAL source or target with
# REQUEST.SINCAL.FEATURE_DISABLED.
sincal = ["powerio-tnd/sincal"]
matrix = ["dep:powerio-matrix"]
# The gridfm-datakit Parquet reader. Off by default so the facade pulls no
# Arrow or Parquet into consumers that never read datasets.
gridfm = [
    "dep:arrow",
    "dep:parquet",
    "dep:bytes",
    "dep:powerio-matrix",
    "powerio-matrix/gridfm",
]
schema = ["dep:schemars", "powerio-tx/schema", "powerio-core/schema", "powerio-dist/schema", "powerio-prob/schema", "powerio-tnd/schema"]

[dependencies]
num-complex = { workspace = true }
powerio-core = { workspace = true }
powerio-tnd.workspace = true
powerio-dist = { workspace = true, default-features = false }
powerio-matrix = { workspace = true, optional = true }
powerio-prob = { workspace = true }
powerio-tx = { workspace = true, default-features = false }
schemars = { workspace = true, optional = true }
bytes = { version = "1.9", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true, optional = true }
parquet = { version = "60", default-features = false, features = ["arrow", "snap"], optional = true }

[dev-dependencies]
rusqlite.workspace = true
powerio-matrix = { workspace = true, features = ["gridfm"] }
tempfile = "3"
zip.workspace = true

[[example]]
name = "generate_schemas"
required-features = ["schema"]

[[example]]
name = "sincal_balanced_access"
required-features = ["sincal"]

[[example]]
name = "sincal_geometry"
required-features = ["sincal"]

[[example]]
name = "sincal_native_multiconductor"
required-features = ["sincal"]

[[example]]
name = "sincal_public"
required-features = ["sincal"]

[lints]
workspace = true

[package]
name = "powerio-capi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C ABI for PowerIO modules, grid exchange formats, and calculations."
license.workspace = true
repository.workspace = true
publish = false

# A C-consumable shared + static library. The header is checked in at
# powerio-capi/include/powerio.h (regenerate with `cbindgen` via cbindgen.toml).
[lib]
name = "powerio_capi"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# Deprecated compatibility alias for 0.11.x source builds; enables no code.
# Remove only in the planned breaking release: https://github.com/eigenergy/powerio/issues/673
arrow = []
# Retained build-feature names for release tooling. ABI 7 exposes one fixed
# symbol set; none of these names gates a C function.
matrix = []
dist = []
prob = []
gridfm = ["powerio/gridfm", "powerio-matrix/gridfm"]

[dependencies]
# Both bindings call the SINCAL adapters directly, so they ask for them
# rather than rely on the facade's default features.
powerio-tnd = { workspace = true, features = ["sincal"] }
powerio-core = { workspace = true }
powerio-dist.workspace = true
powerio.workspace = true
powerio-tx.workspace = true
powerio-matrix.workspace = true
powerio-prob.workspace = true
serde_json = { workspace = true }

[dev-dependencies]
sha2 = "0.10"
rusqlite.workspace = true
tempfile = "3"

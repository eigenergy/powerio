[package]
name = "powerio-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
tempfile = "3"
libfuzzer-sys = "0.4"
powerio = { path = "../powerio" }
powerio-core = { path = "../powerio-core" }
powerio-dist = { path = "../powerio-dist" }
powerio-tx = { path = "../powerio-tx" }

# Detached from the parent workspace (and excluded there): the fuzz crate
# needs nightly + cargo-fuzz and must not ride along on workspace builds.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "matpower"
path = "fuzz_targets/matpower.rs"
test = false
bench = false


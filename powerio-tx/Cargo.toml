[package]
name = "powerio-tx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = 'Compiler infrastructure for power systems: parse, convert, validate, and lower grid models'
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/powerio-tx"
keywords = ["matpower", "parser", "lossless"]
categories = ["science", "parsing"]

# docs.rs renders the `schema` feature too, so the published documentation
# matches the Pages build.
[package.metadata.docs.rs]
all-features = true

[features]
schema = ["dep:schemars", "powerio-core/schema"]

[dependencies]
powerio-core = { workspace = true }
thiserror = "2"
# Byte-slice float parsing for numeric matrix rows, avoiding UTF-8 allocation.
lexical-core = "1"
# A power network is a graph; connectivity/radial diagnostics live on Network.
petgraph = "0.8"
serde.workspace = true
# Format converters (PowerModels / egret JSON) serialize the typed model.
serde_json.workspace = true
quick-xml.workspace = true
zip.workspace = true
uuid.workspace = true
schemars = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true

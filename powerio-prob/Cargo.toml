[package]
name = "powerio-prob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Problem instance builders for power system analysis and optimization."
readme = "README.md"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/powerio-prob"
keywords = ["power-systems", "optimization", "opf", "operations-research"]
categories = ["science", "mathematics"]
# GOCompetition publishes C3DataUtilities without a LICENSE file, so there is no
# grant to redistribute its validation data. The fixture stays for local tests
# and out of the published crate.
exclude = ["tests/data/goc3_14bus_20220707.json"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
matrix = ["dep:powerio-matrix"]

[lib]
name = "powerio_prob"
path = "src/lib.rs"

[dependencies]
powerio-diag = { workspace = true }
powerio.workspace = true
thiserror = "2"
powerio-matrix = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
num-complex.workspace = true
serde_json.workspace = true
tempfile = "3"

[lints]
workspace = true

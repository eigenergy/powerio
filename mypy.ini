# Type gate for the pure-Python layer. The hand-written stubs
# (python/powerio/*.pyi) declare the public typing surface; stubtest compares
# them against the built extension in CI (python.yml), so a Rust-side rename
# fails the gate instead of shipping a stale stub.
#
# No `files` key: the mypy job passes the path on the command line
# (`mypy python/powerio`), and stubtest reuses this config to compare the
# stubs against the installed extension — a `files` key there would load the
# source tree a second time and collide with the import path.
#
# python_version matches the wheel's floor (requires-python, abi3-py311).
[mypy]
python_version = 3.11
warn_unused_ignores = True
no_implicit_optional = True

# Optional transports and pipeline adapters are tested with their own extras.
# Their third-party implementations are outside the base wheel's type check.
[mypy-interop.*,h5py,pandas.*,pypsa.*,polars.*,power_openapi_models.*]
ignore_missing_imports = True
